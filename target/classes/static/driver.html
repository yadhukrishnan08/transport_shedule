<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Driver Dashboard</title>
    <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
    <div class="app-container">
        <header class="app-header">
            <h1>Driver Dashboard</h1>
            <div id="user-info" class="user-info">
                <span id="current-username"></span>
                <button id="logout-btn" class="btn btn-secondary btn-small">Logout</button>
            </div>
        </header>

        <main class="app-main">
            <section id="dashboard-section" class="dashboard">
                <nav class="sidebar">
                    <button class="nav-link active" data-target="assignments-panel">My Assignments</button>
                    <button class="nav-link" data-target="breakdown-panel">Report Breakdown</button>
                    <button class="nav-link" data-target="profile-panel">My Profile</button>
                </nav>

                <section class="content">
                    <!-- Assignments -->
                    <div id="assignments-panel" class="panel active">
                        <h2>My Assignments</h2>
                        <table id="assignments-table" class="data-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Vehicle</th>
                                    <th>Route</th>
                                    <th>Departure</th>
                                    <th>Arrival</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>

                    <!-- Report Breakdown -->
                    <div id="breakdown-panel" class="panel">
                        <h2>Report Breakdown</h2>
                        <form id="breakdown-form" class="grid-2" novalidate>
                            <div class="form-group">
                                <label for="breakdown-schedule">Select Schedule / Vehicle</label>
                                <select id="breakdown-schedule" required>
                                    <option value="">-- Select --</option>
                                </select>
                                <small class="error-message" id="breakdown-schedule-error"></small>
                            </div>
                            <div class="form-group full-width">
                                <label for="breakdown-description">Description</label>
                                <textarea id="breakdown-description" rows="3" required></textarea>
                                <small class="error-message" id="breakdown-description-error"></small>
                            </div>
                            <div class="form-actions">
                                <button type="submit" class="btn btn-primary">Report Breakdown</button>
                            </div>
                        </form>
                    </div>

                    <!-- Profile -->
                    <div id="profile-panel" class="panel">
                        <h2>My Profile</h2>
                        <div id="profile-details">
                            <p><strong>Name:</strong> <span id="profile-name">Loading...</span></p>
                            <p><strong>License:</strong> <span id="profile-license">Loading...</span></p>
                            <p><strong>Phone:</strong> <span id="profile-phone">Loading...</span></p>
                            <p><strong>Depot:</strong> <span id="profile-depot">Loading...</span></p>
                        </div>
                    </div>
                </section>
            </section>
        </main>
    </div>

    <script src="js/driver.js"></script>
</body>

</html>
