# ===============================
# Spring Boot & Server settings
# ===============================
spring.application.name=transport-app
server.port=8081

# ===============================
# MySQL DataSource configuration
# ===============================
# TODO: Adjust URL, username and password to match your local MySQL setup.
spring.datasource.url=jdbc:mysql://localhost:3306/transport_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=ykdhu@2005
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Initialize database using schema.sql and data.sql on startup
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# ===============================
# JDBC / Connection Pool tuning
# ===============================
spring.datasource.hikari.maximum-pool-size=10

# ===============================
# Logging
# ===============================
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
logging.level.org.springframework.jdbc.datasource.DataSourceTransactionManager=DEBUG

